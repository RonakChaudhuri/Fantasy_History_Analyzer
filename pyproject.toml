[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-history-analyzer"
version = "0.1.0"
description = "A private, read-only ESPN fantasy football history explorer."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "PyYAML==6.0.3",
    "streamlit==1.62.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
    "types-PyYAML==6.0.12.20260724",
]

[tool.setuptools.packages.find]
include = ["fantasy_history*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]
"scripts/phase0_espn_audit.py" = ["S310"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "plotly", "plotly.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
